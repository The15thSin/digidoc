services:
  backend:
    build:
      context: ./backend
    command: uv run python src/app/main.py
    environment:
      ENV: prod
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend/digidoc-app:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"

volumes:
  frontend_node_modules:
